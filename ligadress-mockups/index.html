<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Макеты Ligadress</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px 20px; font-family: "Montserrat", Arial, sans-serif; background: #f4f7f9; color: #0a2a3c; }
      .wrap { max-width: 760px; margin: 0 auto; }
      h1 { font-size: clamp(24px, 4vw, 40px); margin: 0 0 10px; text-transform: uppercase; }
      p { color: #5a6f80; margin: 0 0 28px; line-height: 1.6; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
      a { display: block; background: #fff; border: 1px solid #e2ebef; border-radius: 12px; padding: 20px 24px; color: #00729f; text-decoration: none; font-weight: 600; box-shadow: 0 2px 12px rgba(0,0,0,.04); }
      a:hover { border-color: #00729f; }
      a span { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: #5a6f80; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Макеты Ligadress</h1>
      <p>HTML-макеты страниц для согласования. Сайт не затронут.</p>
      <ul>
        <li><a href="home.html">Главная страница<span>С добавленными категориями СИЗ в каталоге</span></a></li>
        <li><a href="siz.html">Страница СИЗ<span>Каталог СИЗ, производство, документы, форма заказа</span></a></li>
        <li><a href="catalog.html">Страница каталога<span>Добавлен блок СИЗ</span></a></li>
      </ul>
    </div>
  </body>
</html>
